<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto MVP - Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 p-4">
                    <h1 class="h3 mb-2 text-center text-primary fw-bold">Formulário de Atendimento</h1>
                    <p class="text-muted text-center mb-4 small">Preencha os dados abaixo para enviar sua solicitação:</p>
                    
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label text-secondary small fw-semibold">Nome Completo:</label>
                            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary small fw-semibold">E-mail de Contato:</label>
                            <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="categoria" class="form-label text-secondary small fw-semibold">Assunto / Categoria:</label>
                            <select class="form-select" id="categoria">
                                <option value="duvida">Dúvida / Informações</option>
                                <option value="orcamento">Solicitar Orçamento</option>
                                <option value="suporte">Suporte Técnico</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="mensagem" class="form-label text-secondary small fw-semibold">Mensagem:</label>
                            <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-semibold shadow-sm">Enviar Solicitação</button>
                        </diPreencha os dados abaixo para enviar sua solicitação:
            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted border-top bg-white mt-auto">
        <p class="mb-1 small">Desenvolvido por: <strong>Miguel Gonçalves</strong> — 2026</p>
        <p class="mb-0 xsmall text-secondary"><small>Projeto MVP • Colégio Bento Munhoz</small></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
